overrides:
  brace-expansion@5: 5.0.12
  # These GitHub type sources are pinned as direct devDependencies instead;
  # pnpm 12 blocks exotic transitive sources, even when overridden to a commit.
  zotero-types@4>epubjs: "-"
  zotero-types@4>pdfjs-dist: "-"

allowBuilds:
  "@swc/core": true
  esbuild: true
  # This package's postinstall only prints a message; no build is needed.
  es5-ext: false
